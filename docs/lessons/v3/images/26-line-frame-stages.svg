<text x="190.0" y="196.8" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">goal: T, stopped, facing 90°</text>
<text x="400.0" y="650.0" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">x′ is how far along the line, y′ is how far off to the left,</text>
<text x="400.0" y="670.0" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">both measured from S. The line stays put while a stage runs.</text>
