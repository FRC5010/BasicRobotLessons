<text x="190.0" y="46.0" font-size="16" fill="#0072B2" text-anchor="middle" font-weight="bold">Stage one: travelToward</text>
<text x="190.0" y="70.0" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">S to the handoff point</text>
<text x="190.0" y="88.8" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">goal: that point, still moving</text>
