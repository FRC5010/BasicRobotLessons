<text x="100.0" y="148.3" font-size="14" fill="#000000" text-anchor="middle" font-weight="normal">estimator.update(...)</text>
<text x="100.0" y="165.8" font-size="14" fill="#000000" text-anchor="middle" font-weight="normal">every tick: smooth</text>
