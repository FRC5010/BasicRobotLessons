<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" width="800" height="476"><rect x="0" y="0" width="800" height="476" fill="#ffffff"/><text x="14" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0072B2">Pass one: read the first line. It says what went wrong.</text><rect x="10" y="38" width="780" height="78" rx="6" fill="#dcebf5"/><rect x="10" y="38" width="7" height="78" rx="3" fill="#0072B2"/><text x="28" y="63" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#000000" xml:space="preserve">Exception in thread "main" java.lang.NullPointerException: Cannot invoke</text><text x="28" y="85" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#000000" xml:space="preserve">"com.ctre.phoenix6.hardware.TalonFX.setThrottle(double)"</text><text x="28" y="107" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#000000" xml:space="preserve">because "this.m_driveMotor" is null</text><text x="14" y="148" font-family="sans-serif" font-size="16" font-weight="bold" fill="#D55E00">Pass two: the first frame that's yours (first.robot.*). Look there.</text><rect x="10" y="158" width="780" height="34" rx="6" fill="#fbe5d6"/><rect x="10" y="158" width="7" height="34" rx="3" fill="#D55E00"/><text x="28" y="183" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#000000" xml:space="preserve">at first.robot.subsystems.DriveModule.lambda$driveForward$0(DriveModule.java:13)</text><text x="14" y="224" font-family="sans-serif" font-size="16" font-weight="bold" fill="#777777">Library frames and how a tick got here: skim.</text><rect x="10" y="234" width="780" height="56" rx="6" fill="#efefef"/><rect x="10" y="234" width="7" height="56" rx="3" fill="#777777"/><text x="28" y="259" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#555555" xml:space="preserve">at org.wpilib.command3.Mechanism.lambda$runRepeatedly$0(Mechanism.java:118)</text><text x="28" y="281" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#555555" xml:space="preserve">at first.robot.Robot.robotPeriodic(Robot.java:53)</text><rect x="10" y="308" width="780" height="52" rx="6" fill="#e4e4e4" stroke="#000000" stroke-width="2"/><text x="28" y="338" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#000000" xml:space="preserve">at === Command Binding Trace ===.()</text><text x="400" y="328" font-family="sans-serif" font-size="15" fill="#000000">&#8593; above: where it broke</text><text x="400" y="348" font-family="sans-serif" font-size="15" fill="#000000">&#8595; below: which binding scheduled it</text><rect x="10" y="378" width="780" height="34" rx="6" fill="#d6f0e7"/><rect x="10" y="378" width="7" height="34" rx="3" fill="#009E73"/><text x="28" y="403" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#000000" xml:space="preserve">at first.robot.opmode.RobotTeleop.&lt;init&gt;(RobotTeleop.java:41)</text><text x="14" y="436" font-family="sans-serif" font-size="16" font-weight="bold" fill="#009E73">The button binding that scheduled driveForward().</text><text x="14" y="460" font-family="sans-serif" font-size="14" fill="#777777">The last two frames are relabeled, as in the aside, to read like a deployed robot.</text></svg>
