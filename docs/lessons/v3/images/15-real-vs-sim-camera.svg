<line x1="400.0" y1="462.0" x2="400.0" y2="484.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<rect x="120" y="554" width="560" height="48" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="400.0" y="573.8" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">Localizer</text>
<text x="400.0" y="591.3" font-size="14" fill="#000000" text-anchor="middle" font-weight="normal">addVisionMeasurement(pose, timestamp, stdDevs)</text>
<line x1="400.0" y1="532.0" x2="400.0" y2="554.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
