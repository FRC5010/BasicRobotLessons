<text x="400.0" y="173.5" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">the same NetworkTables topic</text>
<text x="400.0" y="192.2" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">limelight-front/results_msgpack</text>
<line x1="400.0" y1="206.0" x2="400.0" y2="240.0" stroke="#000000" stroke-width="3" marker-end="url(#a000000)"/>
<rect x="20" y="232" width="760" height="386" rx="8" fill="#FAFAFA" stroke="#777777" stroke-width="2" stroke-dasharray="7 5"/>
