<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="sans-serif">
<defs><marker id="a000000" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0" y="0" width="800" height="640" fill="#ffffff"/>
<text x="200.0" y="28.0" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">Real robot</text>
<text x="600.0" y="28.0" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">Simulation</text>
<rect x="30" y="44" width="340" height="62" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="200.0" y="61.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">the camera</text>
<text x="200.0" y="79.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">a Limelight sees AprilTags</text>
<text x="200.0" y="98.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">and builds a results frame</text>
<rect x="430" y="44" width="340" height="62" rx="8" fill="#DDF3EB" stroke="#009E73" stroke-width="2"/>
<text x="600.0" y="61.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">VisionIOLimelightSim</text>
<text x="600.0" y="79.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">from the truth pose: which tags a camera</text>
<text x="600.0" y="98.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">here could see, packed as a frame</text>
