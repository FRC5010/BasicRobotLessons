<rect x="120" y="274" width="560" height="48" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="400.0" y="293.8" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">LimelightLib</text>
<text x="400.0" y="311.3" font-size="14" fill="#000000" text-anchor="middle" font-weight="normal">filter frames, trust numbers, latency-corrected timestamps</text>
<rect x="120" y="344" width="560" height="48" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="400.0" y="363.8" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">VisionIOLimelight.updateInputs</text>
<text x="400.0" y="381.3" font-size="14" fill="#000000" text-anchor="middle" font-weight="normal">reads the library, fills VisionIOInputs</text>
<line x1="400.0" y1="322.0" x2="400.0" y2="344.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<rect x="120" y="414" width="560" height="48" rx="8" fill="#DDF3EB" stroke="#009E73" stroke-width="2"/>
<text x="400.0" y="433.8" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">Logger.processInputs</text>
<text x="400.0" y="451.3" font-size="14" fill="#000000" text-anchor="middle" font-weight="normal">records the frames (in a replay, supplies them)</text>
<line x1="400.0" y1="392.0" x2="400.0" y2="414.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<rect x="120" y="484" width="560" height="48" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
