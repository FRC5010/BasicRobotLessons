<line x1="200.0" y1="200.0" x2="289.6" y2="184.2" stroke="#000000" stroke-width="4" marker-end="url(#a000000)"/>
<text x="285.6" y="210.2" font-size="15" fill="#000000" text-anchor="start" font-weight="bold">now 10°</text>
<text x="98.4" y="241.8" font-size="15" fill="#777777" text-anchor="end" font-weight="normal">target 190°</text>
<text x="600.0" y="34.0" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">With optimize</text>
<circle cx="600" cy="200" r="95" fill="#ffffff" stroke="#777777" stroke-width="2"/>
<line x1="600.0" y1="200.0" x2="510.4" y2="215.8" stroke="#777777" stroke-width="3" marker-end="url(#a777777)" stroke-dasharray="7 5"/>
<line x1="600.0" y1="200.0" x2="689.6" y2="184.2" stroke="#000000" stroke-width="4" marker-end="url(#a000000)"/>
