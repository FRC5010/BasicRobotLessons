<text x="600.0" y="400.0" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">stay at 10°,</text>
<text x="600.0" y="420.0" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">drive at −2 m/s</text>
