<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1330" width="800" height="1330" font-family="sans-serif">
<defs><marker id="a000000" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="a0072B2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="a009E73" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="aD55E00" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect x="0" y="0" width="800" height="1330" fill="#ffffff"/>
<text x="400.0" y="34.0" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">Lesson 15: the camera looks out from the estimate</text>
<rect x="30" y="80" width="190" height="80" rx="8" fill="#EEEEEE" stroke="#777777" stroke-width="2"/>
<text x="125.0" y="106.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">Drivetrain</text>
<text x="125.0" y="124.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">wheel encoders</text>
<text x="125.0" y="143.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">and gyro</text>
<rect x="290" y="70" width="240" height="100" rx="8" fill="#FBE9DF" stroke="#D55E00" stroke-width="2"/>
<text x="410.0" y="106.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">Localizer</text>
<text x="410.0" y="124.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">getPose()</text>
<text x="410.0" y="143.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">the estimate</text>
<rect x="290" y="235" width="240" height="80" rx="8" fill="#EEEEEE" stroke="#777777" stroke-width="2"/>
<text x="410.0" y="270.5" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">Simulated camera</text>
<text x="410.0" y="289.2" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">VisionIOLimelightSim</text>
<line x1="220.0" y1="120.0" x2="290.0" y2="120.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<line x1="410.0" y1="170.0" x2="410.0" y2="235.0" stroke="#D55E00" stroke-width="4" marker-end="url(#aD55E00)"/>
<text x="402.0" y="208.0" font-size="14" fill="#D55E00" text-anchor="end" font-weight="normal">looks out from here</text>
<path d="M530,275 L640,275 L640,120 L530,120" fill="none" stroke="#D55E00" stroke-width="4" marker-end="url(#aD55E00)"/>
<text x="650.0" y="190.0" font-size="14" fill="#D55E00" text-anchor="start" font-weight="normal">addVisionMeasurement</text>
<text x="650.0" y="207.5" font-size="14" fill="#D55E00" text-anchor="start" font-weight="normal">corrects the estimate</text>
<text x="400.0" y="352.0" font-size="15" fill="#D55E00" text-anchor="middle" font-weight="bold">A closed loop: the estimate is corrected toward a picture it drew itself.</text>
<line x1="20" y1="385" x2="780" y2="385" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="7 5"/>
<text x="400.0" y="434.0" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">Lesson 16: two loops, meeting only at the camera</text>
<rect x="200" y="460" width="400" height="74" rx="8" fill="#EEEEEE" stroke="#777777" stroke-width="2"/>
<text x="400.0" y="492.5" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">the four SwerveModules</text>
<text x="400.0" y="511.2" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">measured wheel speed and angle</text>
<rect x="20" y="600" width="350" height="84" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="195.0" y="628.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">simulateChassis()</text>
<text x="195.0" y="646.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">toChassisVelocities(measured states)</text>
<text x="195.0" y="665.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">once a tick, sim only</text>
<rect x="20" y="740" width="350" height="110" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="195.0" y="771.8" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">ChassisSimulation: the truth</text>
<text x="195.0" y="790.5" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">update(wheels, 0.020)</text>
<text x="195.0" y="809.2" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">grip limit: kMaxAccelMps2</text>
<text x="195.0" y="828.0" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">= kWheelCoF × 9.81 = 11.77 m/s²</text>
<rect x="20" y="910" width="350" height="66" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="195.0" y="938.5" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">getSimulatedPose()</text>
<text x="195.0" y="957.2" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">the truth, for the cameras and for you</text>
<rect x="420" y="600" width="360" height="100" rx="8" fill="#FBE9DF" stroke="#D55E00" stroke-width="2"/>
<text x="600.0" y="626.8" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">Localizer: the estimate</text>
<text x="600.0" y="645.5" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">odometry from the encoders</text>
<text x="600.0" y="664.2" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">and the gyro's heading</text>
<text x="600.0" y="683.0" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">reads only what sensors report</text>
<rect x="420" y="760" width="360" height="66" rx="8" fill="#EEEEEE" stroke="#777777" stroke-width="2"/>
<text x="600.0" y="788.5" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">GyroIOSim</text>
<text x="600.0" y="807.2" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">reports the chassis' heading</text>
<line x1="300.0" y1="534.0" x2="195.0" y2="600.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<line x1="500.0" y1="534.0" x2="600.0" y2="600.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<text x="150.0" y="578.0" font-size="14" fill="#0072B2" text-anchor="middle" font-weight="normal">follows the wheels,</text>
<text x="150.0" y="596.0" font-size="14" fill="#0072B2" text-anchor="middle" font-weight="normal">not the command</text>
<line x1="195.0" y1="684.0" x2="195.0" y2="740.0" stroke="#0072B2" stroke-width="3" marker-end="url(#a0072B2)"/>
<line x1="195.0" y1="850.0" x2="195.0" y2="910.0" stroke="#0072B2" stroke-width="3" marker-end="url(#a0072B2)"/>
<line x1="370.0" y1="795.0" x2="420.0" y2="795.0" stroke="#0072B2" stroke-width="3" marker-end="url(#a0072B2)"/>
<line x1="600.0" y1="760.0" x2="600.0" y2="700.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<line x1="395" y1="585" x2="395" y2="1010" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="240" y="1060" width="320" height="84" rx="8" fill="#EEEEEE" stroke="#777777" stroke-width="2"/>
<text x="400.0" y="1088.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">Simulated camera</text>
<text x="400.0" y="1106.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">renders from the truth,</text>
<text x="400.0" y="1125.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">reports a pose</text>
<path d="M195,976 L195,1102 L240,1102" fill="none" stroke="#0072B2" stroke-width="3" marker-end="url(#a0072B2)"/>
<path d="M560,1102 L760,1102 L760,650 L780,650" fill="none" stroke="#009E73" stroke-width="4" marker-end="url(#a009E73)"/>
<text x="660.0" y="1088.0" font-size="14" fill="#009E73" text-anchor="middle" font-weight="normal">addVisionMeasurement</text>
<text x="400.0" y="1182.0" font-size="15" fill="#009E73" text-anchor="middle" font-weight="bold">The estimate and the truth never read each other.</text>
<text x="400.0" y="1204.0" font-size="15" fill="#009E73" text-anchor="middle" font-weight="bold">Only the camera carries news from one to the other.</text>
</svg>
