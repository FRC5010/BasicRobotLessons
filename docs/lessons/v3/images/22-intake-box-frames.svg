<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="800" height="850" font-family="sans-serif">
<defs><marker id="a000000" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0" y="0" width="800" height="850" fill="#ffffff"/>
<text x="400.0" y="30.0" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">The field's frame: x along the field, y across</text>
