<line x1="148.0" y1="231.0" x2="206.2" y2="197.4" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<circle cx="148.0" cy="231.0" r="5" fill="#000000"/>
<circle cx="220.0" cy="175.0" r="9" fill="#D55E00" stroke="#000000" stroke-width="2"/>
<text x="430.0" y="120.0" font-size="15" fill="#000000" text-anchor="start" font-weight="bold">piece at (4.5, 3.2)</text>
<text x="430.0" y="160.0" font-size="15" fill="#000000" text-anchor="start" font-weight="bold">robot at (4.05, 2.85),</text>
<text x="430.0" y="178.8" font-size="15" fill="#000000" text-anchor="start" font-weight="bold">heading 30° (an example)</text>
<text x="430.0" y="230.0" font-size="15" fill="#777777" text-anchor="start" font-weight="normal">The box tilts with the robot,</text>
<text x="430.0" y="248.8" font-size="15" fill="#777777" text-anchor="start" font-weight="normal">so "is the piece in it?"</text>
<text x="430.0" y="267.5" font-size="15" fill="#777777" text-anchor="start" font-weight="normal">is awkward to ask here.</text>
<line x1="150.0" y1="362.0" x2="150.0" y2="398.0" stroke="#000000" stroke-width="3" marker-end="url(#a000000)"/>
<text x="172.0" y="386.0" font-size="15" fill="#000000" text-anchor="start" font-weight="normal">1. subtract the robot's position</text>
<line x1="150.0" y1="402.0" x2="150.0" y2="438.0" stroke="#000000" stroke-width="3" marker-end="url(#a000000)"/>
<text x="172.0" y="426.0" font-size="15" fill="#000000" text-anchor="start" font-weight="normal">2. rotateBy the robot's opposite heading</text>
<text x="400.0" y="466.0" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">The robot's frame: x straight ahead, y to the left</text>
<rect x="20" y="486" width="760" height="290" rx="2" fill="#FAFAFA" stroke="#777777" stroke-width="2"/>
<rect x="125.0" y="510.0" width="180.0" height="180.0" rx="2" fill="#EEEEEE" stroke="#777777" stroke-width="2"/>
<text x="175.0" y="605.0" font-size="15" fill="#777777" text-anchor="middle" font-weight="normal">robot</text>
<rect x="305.0" y="508.56" width="91.43999999999998" height="182.87999999999997" rx="2" fill="#E8F3FA" stroke="#0072B2" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="215" cy="600" r="5" fill="#000000"/>
<line x1="215.0" y1="600.0" x2="270.0" y2="600.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<text x="247.0" y="590.0" font-size="14" fill="#000000" text-anchor="middle" font-weight="normal">+x</text>
<circle cx="384.4" cy="576.6" r="9" fill="#D55E00" stroke="#000000" stroke-width="2"/>
<text x="470.0" y="545.0" font-size="15" fill="#0072B2" text-anchor="start" font-weight="bold">The box: past the front bumper,</text>
<text x="470.0" y="563.8" font-size="15" fill="#0072B2" text-anchor="start" font-weight="bold">12 in deep (kIntakeReach),</text>
<text x="470.0" y="582.5" font-size="15" fill="#0072B2" text-anchor="start" font-weight="bold">24 in wide (kIntakeWidth).</text>
<text x="470.0" y="625.0" font-size="15" fill="#000000" text-anchor="start" font-weight="bold">The piece lands at (0.56, 0.08):</text>
<text x="470.0" y="645.0" font-size="15" fill="#000000" text-anchor="start" font-weight="normal">past the bumper, inside the width.</text>
<text x="470.0" y="665.0" font-size="15" fill="#000000" text-anchor="start" font-weight="normal">Three plain comparisons say yes.</text>
<line x1="215.0" y1="732.0" x2="396.4" y2="732.0" stroke="#000000" stroke-width="2"/>
<line x1="215.0" y1="725.0" x2="215.0" y2="739.0" stroke="#000000" stroke-width="2"/>
<line x1="396.4" y1="725.0" x2="396.4" y2="739.0" stroke="#000000" stroke-width="2"/>
<text x="305.7" y="754.0" font-size="14" fill="#000000" text-anchor="middle" font-weight="normal">0.3 m + 0.3 m</text>
<text x="400.0" y="812.0" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">A piece is caught once its center is inside the box:</text>
<text x="400.0" y="834.0" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">about 0.6 m ahead of the robot's center.</text>
