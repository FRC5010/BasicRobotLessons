<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="sans-serif">
<defs><marker id="a000000" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
<text x="25.0" y="32.0" font-size="17" fill="#000000" text-anchor="start" font-weight="bold">Finished: the robot got to 1.0 m</text>
<rect x="25" y="50" width="230" height="76" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="140.0" y="74.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">1. start</text>
<text x="140.0" y="92.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">setPosition(0)</text>
<text x="140.0" y="111.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">setThrottle(0.4)</text>
<line x1="255.0" y1="88.0" x2="285.0" y2="88.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<rect x="285" y="50" width="230" height="76" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="400.0" y="74.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">2. waitUntil(...)</text>
<text x="400.0" y="92.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">the distance reached</text>
<text x="400.0" y="111.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">1.0, so it returns</text>
<line x1="515.0" y1="88.0" x2="545.0" y2="88.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<rect x="545" y="50" width="230" height="76" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="660.0" y="74.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">3. body ends</text>
<text x="660.0" y="92.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">last line runs,</text>
<text x="660.0" y="111.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">the command is done</text>
<line x1="660.0" y1="126.0" x2="660.0" y2="176.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<rect x="545" y="176" width="230" height="76" rx="8" fill="#DDF3EB" stroke="#009E73" stroke-width="2"/>
<text x="660.0" y="209.5" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">.whenExited(...)  RUNS</text>
<text x="660.0" y="228.2" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">setThrottle(0)</text>
<rect x="285" y="176" width="230" height="76" rx="8" fill="#EEEEEE" stroke="#777777" stroke-width="2" stroke-dasharray="7 5"/>
<text x="400.0" y="200.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">.whenCanceled(...)</text>
<text x="400.0" y="218.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">silent: nothing</text>
<text x="400.0" y="237.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">was interrupted</text>
<text x="400.0" y="272.0" font-size="14" fill="#777777" text-anchor="middle" font-weight="normal">does not run</text>
<text x="25.0" y="312.0" font-size="17" fill="#000000" text-anchor="start" font-weight="bold">Canceled: another command takes the module mid-drive</text>
<rect x="25" y="330" width="230" height="76" rx="8" fill="#E3F0FA" stroke="#0072B2" stroke-width="2"/>
<text x="140.0" y="354.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">1. start</text>
<text x="140.0" y="372.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">setPosition(0)</text>
<text x="140.0" y="391.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">setThrottle(0.4)</text>
<line x1="255.0" y1="368.0" x2="285.0" y2="368.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<rect x="285" y="330" width="230" height="76" rx="8" fill="#FBE9DF" stroke="#D55E00" stroke-width="2" stroke-dasharray="7 5"/>
<text x="400.0" y="354.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">2. waitUntil(...)</text>
<text x="400.0" y="372.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">still waiting.</text>
<text x="400.0" y="391.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">It never returns</text>
<line x1="515.0" y1="368.0" x2="545.0" y2="368.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<rect x="545" y="330" width="230" height="76" rx="8" fill="#FBE9DF" stroke="#D55E00" stroke-width="2"/>
<text x="660.0" y="354.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">3. interrupted</text>
<text x="660.0" y="372.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">the scheduler cancels</text>
<text x="660.0" y="391.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">this command</text>
<line x1="660.0" y1="406.0" x2="660.0" y2="456.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<rect x="545" y="456" width="230" height="76" rx="8" fill="#DDF3EB" stroke="#009E73" stroke-width="2"/>
<text x="660.0" y="489.5" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">.whenExited(...)  RUNS 1st</text>
<text x="660.0" y="508.2" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">setThrottle(0)</text>
<line x1="545.0" y1="494.0" x2="515.0" y2="494.0" stroke="#000000" stroke-width="2" marker-end="url(#a000000)"/>
<rect x="285" y="456" width="230" height="76" rx="8" fill="#FBE9DF" stroke="#D55E00" stroke-width="2"/>
<text x="400.0" y="480.1" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">.whenCanceled(...)  RUNS 2nd</text>
<text x="400.0" y="498.9" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">anything you put</text>
<text x="400.0" y="517.6" font-size="15" fill="#000000" text-anchor="middle" font-weight="normal">there</text>
</svg>
