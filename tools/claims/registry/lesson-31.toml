# Numbers Lesson 31 (testing) quotes that a library change could move.
# All from the lesson's own ElevatorHomingTest with Thread.sleep varied, a fresh JVM per run.

[[claim]]
id = "l31.sleep20-height"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "ElevatorHomingTest with a full 20 ms sleep per tick ends at a final height of 0.0090 m."
evidence = "CLAUDE.md, 'Lessons 28-32 re-measured on alpha-8', Lesson 31 (eight runs); tools/figures/data/31-homing-20ms-*.csv"
measured_on = "alpha-8"
method = "LOOP"
wording = "0.0090 m; Figure 31.2's alt text and prose: jumps to 0.009 m"
unit = "m"
range = [0.00895, 0.00905]
measured = "0.0090 m in 8 of 8; figure data 0.00904 m"
test = "tools/figures/probes/Fig31HomingHeight.java"
figure = "31-homing-test-height.png"
note = "The alt text and prose say 0.009 m (a looser rounding); 0.0090 in the table is the tighter wording."

[[claim]]
id = "l31.sleep4-height"
kind = "number"
library = ["phoenix6", "wpilib"]
