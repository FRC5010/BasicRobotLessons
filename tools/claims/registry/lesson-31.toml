measured_on = "alpha-8"
method = "LOOP"
wording = "0.0075-0.0094 m"
unit = "m"
range = [0.00745, 0.00945]
measured = "0.0090 five times, 0.0075 twice, 0.0094 once (eight runs); figure data 0.00748 m"
test = "tools/figures/probes/Fig31HomingHeight.java"

[[claim]]
id = "l31.sleep0-fail"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C1"
statement = "With no sleep the homing test ends at about -0.34 m (a third of a metre below the floor) in seven runs of eight and at 0.0094 m in the eighth, so the trap is intermittent."
evidence = "CLAUDE.md, 'Lessons 28-32 re-measured on alpha-8', Lesson 31; Batch 2 found, Lesson 31's trap (Figure 31.2): five of six no-sleep runs end at -0.3415 m; tools/figures/data/31-homing-0ms-*.csv"
measured_on = "alpha-8"
method = "LOOP"
wording = "-0.34 m in seven runs of eight (0.0094 m in the eighth); a third of a metre; about minus 0.34 m (Figure 31.1 and 31.2 alt text); one fails one run in five"
unit = "m"
range = [-0.345, -0.335]
measured = "-0.3396 to -0.3415 in 7 of 8 (alpha-7 build: 5 of 8); figure data -0.34151 in 5 of 6 runs"
test = "tools/figures/probes/Fig31HomingHeight.java"
figure = "31-two-clocks.svg"
note = "Range is for the failing runs' final height. A count of random outcomes: the lesson's conclusion (a cliff, intermittent, usually fails) holds for roughly 4 to 8 failures of 8; only 0 or 1 would make the lesson's 'it can be intermittent' stop being true."

