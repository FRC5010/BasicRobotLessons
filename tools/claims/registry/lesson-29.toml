# Numbers Lesson 29 (current limits) quotes that a library change could move.
# Format: tools/claims/README.md. Tables: CLAUDE.md, 'v3 Lessons 28-32 re-measured on alpha-8'
# (batch 2b), Lesson 29. BARE rigs: one default-config Kraken on a FlywheelSim, no Robot. LOOP: the
# real Robot with GamepadSim (Back, D-pad up, left trigger + left face button), ten runs per
# fresh-battery configuration (thirty for no limits in the notes), ten/thirty per tired-battery one.
# Figure data: tools/figures/data/29-*.csv. Counts of random outcomes carry the band in which
# the lesson's conclusion still holds, in the note.

[[claim]]
id = "l29.stall-supply-0"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "A default-config Kraken given a full 12 V from a standstill, 0.00 s after the request, draws 29.8 A of supply current (same row: 0.0 rot/s, 119.0 A stator, 3.00 V applied)."
evidence = "CLAUDE.md, 'v3 Lessons 28-32 re-measured on alpha-8', Lesson 29, the supply/stator table (BARE); alpha-7 reproduced the old table to the digit"
measured_on = "alpha-8"
method = "BARE"
wording = "29.8 A supply at 0.00 s (the table row, and the arithmetic checks in section 2: 119.0 x 3.00/12 = 29.8, 114.7 x 7.25/12 = 69.3)"
unit = "A"
range = [29.75, 29.85]
measured = "29.8 A, runs agree within 0.2 A (alpha-7: a single early 116.3 A / 29.1 A sample)"
note = "The row's other numbers (speed, stator current, applied volts) are the same run; a check should read all four columns. Stated per row because a claim holds one range."

