evidence = "CLAUDE.md, 'v3 Lessons 18-22 record with AdvantageKit', Lesson 19 (checked under Xvfb with an animated LoggedMechanism2d probe) and the SimGUI tips (b2g6: a Mechanism window opens small). KNOWN NOT TO HOLD for AdvantageScope 27.0.0-alpha-6 (the user, 2026-11-21, Lesson 25 state): the Mechanism tab on /AdvantageKit/RealOutputs/Elevator/Mechanism shows the background and '0 segments' though every value is in the tree. Both AdvantageKit 27.0.0-alpha-7's LoggedMechanismRoot2d and WPILib alpha-8's MechanismRoot2d publish the root as one 'position' array (javap of the jars); that older versions published 'x' and 'y' and AdvantageScope looks for those is a guess. User decision: leave Lessons 19, 20 and 28 as they are and re-check on a newer AdvantageScope. The SimGUI half holds."
