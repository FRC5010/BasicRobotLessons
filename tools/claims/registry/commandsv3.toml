[[claim]]
id = "commandsv3.coroutine-await-yield-wait"
kind = "api"
library = ["commandsv3"]
criticality = "C1"
statement = "In a coroutine body, coroutine.yield() suspends until the next tick, coroutine.waitUntil(condition) polls it each tick, coroutine.wait(Time) pauses, and coroutine.await(command) schedules the command and suspends until it finishes; a coroutine written this way ends when its body runs out of code."
evidence = "Lessons 6, 8 and 9 compile and run on alpha-8 (verify-lessons-v3.sh; Figure 8.1's probe); no source reading recorded in CLAUDE.md"
measured_on = "alpha-8"
method = "LOOP"

