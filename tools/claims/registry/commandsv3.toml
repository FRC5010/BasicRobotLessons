[[claim]]
id = "commandsv3.cancelled-coroutine-not-resumed"
kind = "behaviour"
library = ["commandsv3"]
criticality = "C1"
statement = "A coroutine command that is cancelled is simply never resumed, so no code after the line it was waiting on runs, not even a finally block; a finishing coroutine runs its trailing code, so cleanup after an await covers only the finish."
evidence = "CLAUDE.md, 'v3 Lesson 25 (path events)', 'There was no finallyDo on alpha-7' (independent scheduler: a finishing coroutine runs its trailing code and finally, a canceled one runs whenCanceled only, never its finally)"
measured_on = "alpha-7, listed unchanged on alpha-8"
method = "RIG"

[[claim]]
id = "commandsv3.cancel-parent-cancels-awaited-child"
kind = "behaviour"
library = ["commandsv3"]
criticality = "C1"
statement = "Cancelling a coroutine command also cancels the child command it is awaiting (a cancelled parent runs its own exit and cancel hooks, then the child's), so a wrapper around a path's command still stops the robot."
evidence = "CLAUDE.md, 'v3 Lesson 25 (path events)' ('Canceling a parent cancels the child it awaits') and the alpha-8 whenExited hook probe ('a cancelled parent runs its own EXIT, CANCEL, then the awaited child's EXIT, CANCEL')"
measured_on = "alpha-8"
method = "RIG"

