# Claims about Commands V3 (org.wpilib.command3): the scheduler, commands, triggers, mechanisms.
# Format: tools/claims/README.md.

[[claim]]
id = "commandsv3.periodic-before-commands"
kind = "behaviour"
library = ["commandsv3"]
criticality = "C1"
statement = "Scheduler.run() runs every addPeriodic callback, in registration order, before any command, so subsystem readings are fresh when commands and later periodics read them."
evidence = "CLAUDE.md, 'Facts from the alpha-7 jars' (bytecode); 'v3 Lesson 24 (superstructure) on alpha-7', No premature HOLDING"
measured_on = "alpha-7 (bytecode), relied on in alpha-8 measurements"
method = "BYTECODE"

[[claim]]
id = "commandsv3.commands-run-in-reverse-order"
kind = "behaviour"
library = ["commandsv3"]
criticality = "C1"
statement = "Scheduler.runCommands runs the running commands in reverse insertion order, so in a parallel group the later command's first check can come before the earlier one's first run (why Lesson 25 waits for the remaining distance to go above 0)."
evidence = "CLAUDE.md, 'v3 Lesson 25 (path events)', getRemainingPathDistanceMeters() is 0.0 before the path's first run"
measured_on = "alpha-7, listed unchanged on alpha-8"
method = "LOOP"

[[claim]]
id = "commandsv3.disable-cancels-mechanism-commands"
kind = "behaviour"
library = ["commandsv3"]
criticality = "C1"
statement = "On disable the scheduler cancels every command that requires a mechanism not controllableDuringDisabled (the default), and queues no default commands while disabled; default commands come back on enable."
evidence = "CLAUDE.md, the alpha-8 block, Mechanism commands are cancelled on disable (#9417); 'Batch 1 found', Lessons 1 and 2 crashed at boot"
measured_on = "alpha-8"
method = "LOOP"

[[claim]]
id = "commandsv3.whiletrue-edge-and-enable"
kind = "behaviour"
library = ["commandsv3"]
criticality = "C1"
statement = "whileTrue schedules only on a rising edge and a schedule while disabled is refused, so inState(X).whileTrue(motion) never restarts after a disable; inState(X).and(RobotState::isEnabled).whileTrue(motion) restarts it on enable."
evidence = "CLAUDE.md, 'v3 Lesson 24 (superstructure) on alpha-7', Alpha-8: the bindings are inState(X).and(RobotState::isEnabled) (Check24Probe)"
measured_on = "alpha-8"
method = "LOOP"

[[claim]]
id = "commandsv3.when-exited-on-cancel"
kind = "behaviour"
library = ["commandsv3"]
criticality = "C1"
statement = "whenExited runs when a command finishes, is cancelled, is interrupted, or is cancelled by a disable; whenCanceled runs only when it doesn't finish by itself. On a cancel the order is exit, then cancel, and .until(...) ends its inner command by cancelling it."
evidence = "CLAUDE.md, the alpha-8 block, New Commands V3 API (hook probe, 2026-11-12)"
measured_on = "alpha-8"
method = "LOOP"

[[claim]]
id = "commandsv3.sequence-requires-union"
kind = "behaviour"
library = ["commandsv3"]
criticality = "C1"
statement = "A SequentialGroup (Command.sequence) requires the union of its steps' mechanisms for its whole run, so a sequence that homes the elevator holds the elevator and is evicted by the IDLE motion."
evidence = "CLAUDE.md, 'v3 Lesson 25 (path events)', Every path auto gets ready first"
measured_on = "alpha-7, listed unchanged on alpha-8"
method = "LOOP"

[[claim]]
