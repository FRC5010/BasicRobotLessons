# Claims about GradleRIO and the build (tasks, vendordep loading).
# Format: tools/claims/README.md.

[[claim]]
id = "gradlerio.run-starts-simgui"
kind = "behaviour"
library = ["gradlerio"]
criticality = "C1"
statement = "In the OpMode template, ./gradlew run builds the robot program and starts it with SimGUI."
evidence = "CLAUDE.md, 'v3 Lesson 30 (alerts) on alpha-7', ./gradlew simulateJava doesn't start a simulation (re-checked on the Lesson 0 state, 2026-10-29); the alpha-8 block, simulateJava now fails"
measured_on = "alpha-8"
method = "LOOP"

[[claim]]
id = "gradlerio.vendordeps-auto-loaded"
kind = "behaviour"
library = ["gradlerio"]
criticality = "C1"
statement = "A vendordep JSON saved in vendordeps/ is found by GradleRIO with no edit to build.gradle, and its classes are importable after a rebuild."
evidence = "CLAUDE.md, 'Verifying lesson code' (verify-lessons-v3.sh and update-lesson-v3.sh install vendordeps by saving the JSON; build.gradle is patched only from Lesson 13, for AdvantageKit's replay)"
measured_on = "alpha-8"
method = "BARE"

[[claim]]
id = "gradlerio.requires-jdk-25"
kind = "behaviour"
library = ["gradlerio"]
criticality = "C1"
statement = "The OpMode template targets Java 25 (sourceCompatibility = JavaVersion.VERSION_25), and building under an older JDK fails with 'invalid source release: 25'."
evidence = "CLAUDE.md, 'Verifying lesson code' (this container's JAVA_HOME at 21 failed every lesson with invalid source release: 25); code/OpModeV3Robot/build.gradle lines 8-9"
measured_on = "alpha-8"
method = "BARE"
note = "That the WPILib installer bundles Eclipse Temurin 25 and that ORG_GRADLE_JAVA_HOME works are separate unverified statements (wpilib-tools.installer-contents)."

