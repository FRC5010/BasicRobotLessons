[[claim]]
id = "l05.kp-1e-5-stall"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "With kP = 0.00001 the wheel stalls at 79 degrees, short of 90, because the voltage rounds down to zero in the simulated motor."
evidence = "CLAUDE.md, 'Batch 1 found', user decision 2026-11-19 table (1e-5 stalls at 78.6 deg: applied volts quantize to 0); data/05-steer-kp-0.00001.csv ends at 78.57"
measured_on = "alpha-8"
method = "RIG"
wording = "79°; 79 degrees (Figure 5.2's alt text)"
