[[claim]]
id = "phoenix6.sim-no-static-friction"
kind = "behaviour"
library = ["phoenix6", "wpilib"]
criticality = "C3"
statement = "The simulated flywheel has no friction term: a voltage far below what would break a real wheel free (0.05 V) still turns it, to 0.414 rot/s, so kFlywheelKS does essentially nothing in sim."
evidence = "CLAUDE.md, 'v3 Lesson 33 ... re-measured on alpha-8' (0.05 V open loop from a standstill: 0.414 rot/s flat, 0.05 x 8.46; hand fits give kS under 0.01 V, 'about 0 is right for a sim with no friction')"
measured_on = "alpha-8"
method = "RIG"

[[claim]]
id = "phoenix6.arm-cosine-gravity"
kind = "behaviour"
library = ["phoenix6"]
criticality = "C1"
statement = "With Slot0.GravityType = GravityTypeValue.Arm_Cosine the firmware scales kG by cos(angle), assuming the sensor reads zero with the arm horizontal; GravityTypeValue.Elevator_Static applies kG flat. Holding a simulated arm, the applied volts read kG x cos(angle): +0.25, +0.18, 0.00, -0.18, -0.25 V at 0, 45, 90, 135 and 180 degrees."
evidence = "CLAUDE.md, 'v3 Lesson 20 (intake arm) on alpha-7' (the holding table reproduces exactly) and 'v3 Lessons 7-22 re-measured on alpha-8', Lesson 20 (hold table unchanged); Batch 3, Lesson 20 hold sweep (23 goals, within about 0.002 V of kG cos theta)"
measured_on = "alpha-8"
method = "RIG"
test = "tools/figures/probes/Fig20HoldVoltage.java"
figure = "20-hold-voltage-cosine.png"

