[[claim]]
id = "phoenix6.sim-firmware-wall-clock"
kind = "behaviour"
library = ["phoenix6", "wpilib"]
criticality = "C1"
statement = "In simulation the physics model advances a fixed 20 ms each time it is stepped, while Phoenix's simulated firmware (the closed loop) advances on the wall clock, so a test that steps the scheduler without sleeping a full tick gets stale firmware readings and wrong results."
evidence = "CLAUDE.md, 'v3 Lesson 31 (testing) on alpha-7' and the Lessons 28-32 alpha-8 block (Lesson 31, eight runs per setting); Batch 2 found, Lesson 31's trap (Figure 31.2): with no sleep the height reading is a staircase of stale firmware readings. The wall-clock mechanism is the lesson's explanation; the staircase is measured."
measured_on = "alpha-8"
method = "LOOP"
test = "tools/figures/probes/Fig31HomingHeight.java"

