criticality = "C1"
statement = "new TalonFX(id, new CANBus(CANPort.CAN_S0)) and new CANcoder(id, new CANBus(CANPort.CAN_S0)) build a device on SystemCore's first built-in CAN bus (com.ctre.phoenix6.CANBus, org.wpilib.hardware.bus.CANPort)."
