[[claim]]
id = "phoenix6.cancoder-offset-and-direction"
kind = "behaviour"
library = ["phoenix6"]
criticality = "C3"
statement = "A CANcoder reads counterclockwise-positive by default, and a MagnetOffset equal to the negative of the raw reading at wheel-forward makes it report 0 there."
