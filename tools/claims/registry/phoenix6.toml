[[claim]]
id = "phoenix6.sim-motor-stalls-without-physics"
kind = "behaviour"
library = ["phoenix6"]
criticality = "C2"
statement = "A simulated TalonFX with no physics model fed back to it does not move: a throttle request stalls it, its position and velocity stay at 0, and torqueCurrent pins at the stator limit (about 119 A)."
evidence = "CLAUDE.md, 'Batch 1 found', Lesson 1 (a 0.3 request with the wheel held reads dutyCycle 0.250, 3.0 V, 119 A)"
measured_on = "alpha-8"
method = "LOOP"

