[[claim]]
id = "phoenix6.talonfx-set-throttle"
kind = "api"
library = ["phoenix6"]
criticality = "C1"
statement = "TalonFX.setThrottle(double) takes a -1..1 fraction of full power, and the motor keeps applying it until something else is set."
