statement = "TalonFX.getSimState() returns a TalonFXSimState with setSupplyVoltage, getMotorVoltage, setRawRotorPosition(rotations) and setRotorVelocity(rotations/s), which put fake sensor readings into the motor."
evidence = "Lessons 4-6 snapshots compile on alpha-8 and the Lesson 4 rig drove them (CLAUDE.md, 'Batch 2 found', Lesson 4 rig)"
