[[claim]]
id = "phoenix6.remote-cancoder-feedback"
kind = "behaviour"
library = ["phoenix6"]
criticality = "C1"
statement = "With FeedbackRemoteSensorID and FeedbackSensorSource set to a CANcoder, the steering TalonFX's getPosition()/getVelocity() and its closed loop read the CANcoder continuously, not the rotor, so setPosition on the motor changes nothing."
evidence = "Lesson 12 compiles and runs on alpha-8 (verify-lessons-v3.sh); Lesson 12 Try It #4 (setPosition has no effect) has no recorded probe in CLAUDE.md"
measured_on = "unverified"
method = "LOOP"

[[claim]]
id = "phoenix6.rotor-to-sensor-ratio"
kind = "behaviour"
library = ["phoenix6"]
criticality = "C1"
statement = "With a remote CANcoder, RotorToSensorRatio is the rotor turns per CANcoder turn (25 for the steering gearbox) and SensorToMechanismRatio the CANcoder turns per mechanism turn (1, the CANcoder is on the wheel); with the rotor as the sensor (drive), SensorToMechanismRatio alone carries the 6.75 reduction."
evidence = "Lesson 12 compiles and the steering tracks its target on alpha-8 (CLAUDE.md 'Lesson 12 extends' note); no dedicated probe recorded in CLAUDE.md"
measured_on = "unverified"
method = "LOOP"

