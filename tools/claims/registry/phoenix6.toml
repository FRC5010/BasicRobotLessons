[[claim]]
id = "phoenix6.first-signal-read-waits"
kind = "behaviour"
library = ["phoenix6"]
criticality = "C3"
statement = "Reading a status signal in the first line of a constructor is usually fine because Phoenix's default read waits briefly for a value; if it ever returns 0 the device hadn't reported yet."
evidence = "No record found in CLAUDE.md or tools/figures/data; stated by the lesson"
measured_on = "unverified"

[[claim]]
id = "phoenix6.talonfx-no-output-when-disabled"
kind = "behaviour"
library = ["phoenix6"]
criticality = "C2"
statement = "A TalonFX applies no power while the robot is disabled, whatever the code commands (the simulated arm sagged, the elevator went limp), and resumes its last request on enable."
evidence = "CLAUDE.md, 'v3 Lesson 24 ... on alpha-7', Disable/re-enable (arm sagged to 63 deg while disabled; the elevator was limp at 0.733 m; a TalonFX resumes its last control request on enable). Real-hardware behaviour is not measured."
measured_on = "alpha-8"
method = "LOOP"

[[claim]]
id = "phoenix6.sim-small-voltage-rounds-to-zero"
kind = "behaviour"
library = ["phoenix6"]
criticality = "C3"
statement = "In the simulated TalonFX a very small commanded voltage (kP 0.00001 on the lesson's steering) is applied as 0 V, so the angle stalls short of the setpoint."
evidence = "CLAUDE.md, 'Batch 1 found', user decision 2026-11-19 table (kP 1e-5 stalls at 78.6 deg: applied volts quantize to 0)"
measured_on = "alpha-8"
method = "RIG"
