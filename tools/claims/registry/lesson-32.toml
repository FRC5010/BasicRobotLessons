# Numbers Lesson 32 (reading a log) quotes that a library change could move.
# Measured with the real Elevator homed and ticked at 20 ms (RIG) and by replaying a recording
# of the real Robot loop (REPLAY). CLAUDE.md, 'v3 Lessons 28-32 re-measured on alpha-8', Lesson 32.

[[claim]]
id = "l32.settled-error-range"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "At kScoreMid the carriage settles a stable 0.15-0.19 mm short of the goal."
evidence = "CLAUDE.md, 'Lessons 28-32 re-measured on alpha-8', Lesson 32: 0.1549 or 0.1939 mm short (three readings 0.039 mm apart; a run sits on one and can step to the other); data/32-at-goal-match.csv ends at -0.194 mm"
measured_on = "alpha-8"
method = "RIG"
wording = "0.15-0.19 mm (section 6; Figure 32.1's alt text 'between 0.15 and 0.19 mm')"
unit = "mm"
range = [0.145, 0.195]
measured = "0.1549 or 0.1939 mm; figure data -0.194 mm"
figure = "32-at-goal-never-true.png"

[[claim]]
id = "l32.settled-error-fifth"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C3"
statement = "The settled gap is about a fifth of a millimetre (about minus 0.2 mm in Figure 32.2)."
evidence = "CLAUDE.md, 'Lessons 28-32 re-measured on alpha-8', Lesson 32 (0.1549 or 0.1939 mm; the lesson says 'a fifth of a millimetre' where alpha-7 had 'a tenth'); replay: error over the last second -0.173 to -0.176 mm"
measured_on = "alpha-8"
method = "RIG"
wording = "a fifth of a millimetre; about minus 0.2 mm (Figure 32.2's alt text)"
unit = "mm"
range = [0.18, 0.22]
measured = "0.1549 or 0.1939 mm (RIG); -0.173 to -0.176 mm in the replay; -0.194 mm at the end of the figure data"
figure = "32-replay-fixed-code.png"
note = "A fraction in words gets +-10%. Two of the measured values (0.1549 and the replay's -0.173 to -0.176) fall just outside it."

[[claim]]
id = "l32.tolerance-margin"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C3"
statement = "A 1 mm tolerance is roughly five times the 0.19 mm settled-error floor."
evidence = "CLAUDE.md, 'Lessons 28-32 re-measured on alpha-8', Lesson 32: the 1 mm margin is 5.2 times the larger floor and 6.5 times the smaller"
measured_on = "alpha-8"
method = "ARITHMETIC"
wording = "roughly five times the 0.19 mm floor"
unit = "ratio"
range = [4.5, 5.5]
measured = "5.2 (against 0.1939 mm), 6.5 (against 0.1549 mm)"

