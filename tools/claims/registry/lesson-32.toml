[[claim]]
id = "l32.lucky-tick-fraction"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "With a slightly-too-tight tolerance (0.02 mm, 0.002 mm), in roughly one run in ten one tick lands within 0.001 mm of the goal, so atGoal() reads true for it and the command ends."
evidence = "CLAUDE.md, 'Lessons 28-32 re-measured on alpha-8', Lesson 32: 8 of 50 runs crossed the goal within 0.00094 mm on tick 71 (a ninth came that close once); at 0.002 cm 1 of 12 runs ended, at 0.0002 cm 1 of 16"
measured_on = "alpha-8"
method = "RIG"
wording = "roughly one run in ten"
unit = "fraction of runs"
range = [0.05, 0.2]
measured = "8 of 50 (0.16); 1 of 12; 1 of 16"
note = "A count of random outcomes: the callout's conclusion (it passes by luck, not reliably) holds for about one in twenty to one in five; 8 of 50 is 16%, within it."

