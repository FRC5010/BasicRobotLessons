# Numbers Lesson 20 (the intake arm) quotes that a library change could move.
# Format: tools/claims/README.md. Real Arm and Elevator on a fixed 20 ms schedule (RIG), alpha-8.

[[claim]]
id = "l20.hold-horizontal"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "Holding the arm horizontal (0 degrees) the applied voltage settles at +0.25 V, and at -0.25 V at 180 degrees."
evidence = "CLAUDE.md, 'v3 Lessons 7-22 re-measured on alpha-8', Lesson 20 (+0.25 / -0.25); Batch 3 sweep (+0.251 / -0.250)"
measured_on = "alpha-8"
method = "RIG"
wording = "+0.25 V at 0 degrees; -0.25 V at 180 degrees (table); about +0.25 with the arm level (Figure 20.2's text)"
unit = "V"
range = [0.245, 0.255]
measured = "+0.251 at 0 degrees, -0.250 at 180 degrees (magnitude)"
test = "tools/figures/probes/Fig20HoldVoltage.java"
figure = "20-hold-voltage-cosine.png"
note = "The range is on the magnitude; the sign flips past vertical."

