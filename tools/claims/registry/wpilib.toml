[[claim]]
id = "wpilib.swerve-kinematics-api"
kind = "api"
library = ["wpilib"]
criticality = "C1"
statement = "SwerveDriveKinematics(Translation2d...) has toSwerveModuleVelocities(ChassisVelocities) returning SwerveModuleVelocity[] in constructor order, and desaturateWheelVelocities(states, LinearVelocity). ChassisVelocities(vx, vy, omega) and SwerveModuleVelocity(LinearVelocity, Rotation2d) take Units measures but store plain doubles (vx, vy, omega, velocity in m/s and rad/s); SwerveModuleVelocity() is zero speed at zero angle."
evidence = "Lessons 10-12 compile on alpha-8 (verify-lessons-v3.sh); no dedicated reading recorded in CLAUDE.md"
measured_on = "alpha-8"
method = "SOURCE"
note = "These alpha names (SwerveModuleVelocity, ChassisVelocities, toSwerveModuleVelocities, desaturateWheelVelocities) replace the 2026 SwerveModuleState, ChassisSpeeds, toSwerveModuleStates and desaturateWheelSpeeds."

[[claim]]
id = "wpilib.swerve-velocity-methods-return-new"
kind = "behaviour"
library = ["wpilib"]
criticality = "C1"
statement = "SwerveModuleVelocity.optimize(Rotation2d) and ChassisVelocities.toRobotRelative(Rotation2d) do not change the object they are called on; they return a new one, so the result has to be assigned back. optimize picks the shorter steering move (flipping the sign of the drive speed), so no steering move exceeds 90 degrees."
evidence = "Lesson 10 states it; no probe or source reading recorded in CLAUDE.md. Lesson 10 compiles on alpha-8."
measured_on = "unverified"
method = "SOURCE"

