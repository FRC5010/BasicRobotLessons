# Claims about WPILib itself (the OpModeRobot framework, telemetry, math, the simulator).
# Format: tools/claims/README.md.

[[claim]]
id = "wpilib.opmode-lifecycle"
kind = "behaviour"
library = ["wpilib"]
criticality = "C1"
statement = "Picking an opmode constructs it; Enable runs start(); Disable runs end() then close() on the same tick, and a fresh opmode is constructed on the next one. Picking a different opmode runs close() on the one left."
evidence = "CLAUDE.md, 'Batch 2 found', first bullet (Check00OpModeLifecycle, OpModeRobot.loopFunc bytecode)"
measured_on = "alpha-8"
method = "LOOP"
test = "tools/figures/probes/Check00OpModeLifecycle.java"
figure = "00-opmode-lifecycle.svg"

[[claim]]
id = "wpilib.add-opmode-needs-second-publish"
kind = "behaviour"
library = ["wpilib"]
criticality = "C1"
statement = "Opmodes added with addOpMode in Robot's constructor appear only after a second publishOpModes(), because OpModeRobot's constructor scans and publishes before the subclass body runs. A name already used by an annotated opmode throws IllegalArgumentException at boot."
evidence = "CLAUDE.md, 'v3 Lesson 25 (path events)', One opmode class, many autos"
measured_on = "alpha-7, listed unchanged on alpha-8"
method = "LOOP"

[[claim]]
id = "wpilib.opmode-id-zero-in-robot-constructor"
kind = "behaviour"
library = ["wpilib", "commandsv3"]
criticality = "C1"
statement = "RobotState.getOpModeId() is 0 until the user program has started, so a Trigger binding made in Robot's constructor is Global and keeps running when another opmode is selected."
evidence = "CLAUDE.md, 'v3 Lesson 24 (superstructure) on alpha-7' (DriverStationBackend source; measured Intake Motion surviving an opmode change)"
measured_on = "alpha-7, listed unchanged on alpha-8"
method = "LOOP"

[[claim]]
id = "wpilib.telemetry-log-is-a-snapshot"
