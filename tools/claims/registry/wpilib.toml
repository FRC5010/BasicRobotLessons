[[claim]]
id = "wpilib.kraken-x60-model"
kind = "api"
library = ["wpilib"]
criticality = "C1"
statement = "DCMotor.getKrakenX60(n) is 7.157 N*m stall torque, 374.4 A stall current, 2 A free current and 6065 RPM free speed on 12 V (from CTRE's dynamometer data). The lessons' feedforward gains and kMaxSpeed are derived from these."
evidence = "CLAUDE.md, the alpha-8 block, DCMotor.getKrakenX60 changed (#9378; javap of wpimath-java-2027.0.0-alpha-8)"
measured_on = "alpha-8"
method = "BYTECODE"

[[claim]]
id = "wpilib.debouncer-replayable-clock"
kind = "behaviour"
library = ["wpilib", "advantagekit"]
criticality = "C1"
statement = "org.wpilib.math.filter.Debouncer takes its time in seconds as a double and reads MathSharedStore.getTimestamp(), the clock AdvantageKit replays, so a debounced decision replays on the same tick."
evidence = "CLAUDE.md, 'v3 Lessons 23-27 record with AdvantageKit', Lesson 24 (the Debouncer replays)"
measured_on = "alpha-7 (AdvantageKit's alpha-7 jar)"
method = "REPLAY"

