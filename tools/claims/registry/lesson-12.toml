[[claim]]
id = "l12.voltage-reaches-model-time"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C3"
statement = "Within about a tenth of a second of a step from a standstill the applied voltage is at kV x requested."
evidence = "CLAUDE.md, 'Batch 1 found', Lesson 12; data/12-feedforward-step-kv08-*.csv"
measured_on = "alpha-8"
method = "RIG"
wording = "within about a tenth of a second"
unit = "s"
range = [0.08, 0.12]
measured = "4.54-4.96 V at 0.08-0.12 s, 5.1-5.25 V at 0.14 s, within 0.01 V of 5.01 only from about 0.26 s"
note = "Try It #1. The first ticks read 3 V (current limit), so how closely the voltage must match kV x requested decides whether the wording holds; see the findings. Range per the README fraction rule. DISAGREE: at 0.08-0.12 s the voltage is 4.54-4.96 V against 5.01 V, within 0.01 V only from about 0.26 s; reported to the user 2026-11-19."
