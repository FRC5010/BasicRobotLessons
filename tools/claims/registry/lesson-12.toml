# Numbers Lesson 12 quotes that a library change could move. Format: tools/claims/README.md.

[[claim]]
id = "l12.step-full-voltage"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "With kDriveKV = 0.8 the applied voltage after a 2 m/s step settles at 5.01 V (0.8 x 6.27 wheel rps)."
evidence = "CLAUDE.md, 'Batch 1 found', Lesson 12, a 2 m/s step on one module; data/12-feedforward-step-*.csv"
measured_on = "alpha-8"
method = "RIG"
wording = "5.01 V"
unit = "V"
range = [5.005, 5.015]
measured = "5.01 V in all six runs"
figure = "12-feedforward-step.png"

