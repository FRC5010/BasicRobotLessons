[[claim]]
id = "l21.snap"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "When the switch trips, HeightMeters snaps from about -0.34 m to 0.01 m."
evidence = "CLAUDE.md, 'v3 Lessons 7-22 re-measured on alpha-8', Lesson 21 (the snap -0.3400 to 0.0100; -0.3387 to 0.0100 on a homing run)"
measured_on = "alpha-8"
method = "LOOP"
wording = "from about -0.34 m to 0.01 m"
unit = "m"
range = [-0.35, -0.33]
measured = "-0.3400 and -0.3387 m before the snap; 0.0100 m after"
note = "The range is on the 'about -0.34' value; the 0.01 m after the snap is the course's kBottomLimitHeight, not a measurement."
