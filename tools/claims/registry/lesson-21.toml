# Numbers Lesson 21 (homing) quotes that a library change could move.
# Format: tools/claims/README.md. Real Elevator and Robot loop, 20 ms ticks, alpha-8.

[[claim]]
id = "l21.sink-rate"
kind = "number"
library = ["wpilib", "phoenix6"]
criticality = "C2"
statement = "An unpowered simulated carriage sinks at just under 2 cm/s (about two centimeters every second)."
evidence = "CLAUDE.md, 'v3 Lessons 7-22 re-measured on alpha-8', Lesson 21 (the unpowered sink 1.958 cm/s)"
measured_on = "alpha-8"
method = "LOOP"
wording = "about two centimeters every second; just under 2 cm/s"
unit = "cm/s"
range = [1.0, 2.0]
measured = "1.958 cm/s"
note = "'About two' allows 1-3 and 'just under 2' allows 1-2; the intersection is used."

[[claim]]
id = "l21.land-time"
kind = "number"
library = ["wpilib", "phoenix6"]
criticality = "C2"
statement = "Left alone, the carriage reaches the bottom and AtBottomLimit flips true about 18 seconds after launch."
evidence = "CLAUDE.md, 'v3 Lessons 7-22 re-measured on alpha-8', Lesson 21 (17.9, 18.1 and 18.4 s after launch)"
measured_on = "alpha-8"
method = "LOOP"
wording = "about 18 seconds after launch"
unit = "s"
range = [17.0, 19.0]
measured = "17.9, 18.1 and 18.4 s after launch"
note = "Time from launch; Figure 21.1's own axis counts from the program's first loop (see l21.fig-land-time)."

[[claim]]
id = "l21.fig-land-time"
kind = "number"
library = ["wpilib", "phoenix6"]
criticality = "C3"
statement = "In Figure 21.1's runs AtBottomLimit first reads true 17.4 s after the robot program's first loop."
evidence = "tools/figures/data/21-belief-vs-truth-run1.csv and run2.csv, read 2026-11-19 (17.38 s in both)"
measured_on = "alpha-8"
method = "LOOP"
wording = "about 17.4 seconds"
unit = "s"
range = [16.4, 18.4]
measured = "17.38 s in both runs"
test = "tools/figures/probes/Fig21Homing.java"
figure = "21-belief-vs-truth.png"

[[claim]]
id = "l21.top-stall-height"
kind = "number"
library = ["wpilib", "phoenix6"]
