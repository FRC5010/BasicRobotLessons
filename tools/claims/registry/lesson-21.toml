unit = "A"
range = [118.0, 120.0]
measured = "119.0 A at the top, 118.98 A at the bottom, speed 0.00000 m/s"
note = "'0.000 m/s' is a bare number with range [-0.0005, 0.0005]; measured 0.00000."

[[claim]]
id = "l21.homing-speed"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "Homing at -0.7 V descends at about 10 cm/s."
evidence = "CLAUDE.md, 'v3 Lessons 7-22 re-measured on alpha-8', Lesson 21 (homing descends at 9.719 cm/s)"
measured_on = "alpha-8"
method = "LOOP"
wording = "about 10 cm/s"
unit = "cm/s"
range = [9.0, 11.0]
measured = "9.719 cm/s"
note = "Whole number ending in zero: a unit is ten, so [0, 20] by the README rule. Very loose for a speed; reported as UNSURE."

