# Numbers Lesson 28 (flywheel) quotes that a library change could move.
# Format: tools/claims/README.md. Measured with the real Flywheel through the scheduler on a fixed
# 20 ms schedule (RIG) and in the real Robot loop (LOOP); CLAUDE.md, 'v3 Lessons 28-32
# re-measured on alpha-8', Lesson 28. Figure data: tools/figures/data/28-*.csv, from
# tools/figures/probes/Fig28SpinUp.java. The 42.96 rot/s arithmetic and kV x 60 are course
# constants and library claims, not number claims.

[[claim]]
id = "l28.no-model-speed"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "With kFlywheelKV and kFlywheelKA zeroed and only kP, a request for 60 rot/s settles at 43.40 rot/s after five seconds."
evidence = "CLAUDE.md, 'v3 Lessons 28-32 re-measured on alpha-8', Lesson 28 (43.400 rot/s in all seven runs; alpha-7 43.269); data/28-hold-with-without-model-zero.csv"
measured_on = "alpha-8"
method = "RIG"
wording = "43.40 (section 6 and Figure 28.2's alt text); around 43 rot/s; parks around 43 (recap)"
unit = "rot/s"
range = [43.395, 43.405]
measured = "43.400 rot/s in 7 of 7 runs (RIG and LOOP); 43.402 in Figure 28.2's data"
test = "tools/figures/probes/Fig28SpinUp.java"
figure = "28-hold-with-without-model.png"
note = "'Around 43' in the prose allows more, but the bare 43.40 is the tightest wording."

