# Numbers Lesson 24 (the superstructure) quotes that a library change could move.
# Format: tools/claims/README.md. Measured in the real Robot loop at 20 ms with GamepadSim, Blue 1.

[[claim]]
id = "l24.homing-ticks"
kind = "number"
library = ["commandsv3", "phoenix6", "wpilib"]
criticality = "C2"
statement = "Pressing Back to reach IDLE takes 125 to 155 ticks (2.5 to 3.1 s) after the press, quicker the later it is pressed, because the unpowered carriage sinks toward the switch meanwhile."
evidence = "CLAUDE.md, 'v3 Lessons 24-27 re-measured on alpha-8 with the committed Kraken constants', Lesson 24 (homing, Back to IDLE; 12 fresh launches, 3 more on alpha-7)"
measured_on = "alpha-8"
method = "LOOP"
wording = "125 to 155 ticks (2.5 to 3.1 s)"
unit = "ticks"
range = [124.5, 155.5]
measured = "154 ticks pressed 5 ticks after enable (3 of 3), 149 at 30, 143 at 60, 135 at 100, 125 at 150, 95 at 300 ticks (8.1 s after launch); alpha-7 156 and 145"
note = "Depends on how long after launch Back is pressed. In seconds the wording is [2.45, 3.15]. A press at 300 ticks (95 ticks) is below the range; the lesson's 'the later you press it, the quicker' covers it."

