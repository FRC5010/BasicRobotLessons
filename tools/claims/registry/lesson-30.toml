criticality = "C2"
statement = "Spinning the flywheel up to shooting speed holds the rail below 11.5 V for 1.56 s."
evidence = "CLAUDE.md, 'v3 Lessons 28-32 re-measured on alpha-8', Lesson 30 (77-78 ticks, 1.54-1.56 s, five runs); data/30-low-battery-gate.csv (1.56 s)"
measured_on = "alpha-8"
method = "LOOP"
wording = "another 1.6 s (prose); for 1.56 s (Figure 30.3's text and alt text)"
unit = "s"
range = [1.555, 1.565]
measured = "1.54-1.56 s over 5 runs; 1.56 s in the figure's data"
figure = "30-low-battery-gate.png"
note = "The 1.54 s runs are outside the bare 1.56. Reported as too precise."

[[claim]]
id = "l30.shot-dip-low"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "During the shot spin-up the rail sags to 11.19 V."
evidence = "CLAUDE.md, 'v3 Lessons 28-32 re-measured on alpha-8', Lesson 30 (11.18-11.19 V); data/30-low-battery-gate.csv (11.188 V)"
measured_on = "alpha-8"
method = "LOOP"
wording = "down to 11.2 V (prose); 11.19 V (Figure 30.3's text)"
unit = "V"
range = [11.185, 11.195]
measured = "11.18-11.19 V; 11.188 V in the figure's data"
figure = "30-low-battery-gate.png"
