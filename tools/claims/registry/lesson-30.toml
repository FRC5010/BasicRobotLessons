[[claim]]
id = "l30.tired-warning-tick"
kind = "number"
library = ["wpilib"]
criticality = "C3"
statement = "On the tired battery (11 V) the low-battery warning appears on the second tick after boot, while disabled, clears on enable and returns on disable."
evidence = "CLAUDE.md, 'v3 Lessons 28-32 re-measured on alpha-8', Lesson 30 (the rail reads 11.0 V from tick 2, the alert is up on tick 3, 'the second tick after boot'; clear one tick after enable, back one tick after disable)"
measured_on = "alpha-8"
method = "LOOP"
wording = "on the second tick after boot"
unit = "tick"
range = [2, 3]
measured = "alert up on tick 3, the second tick after the first"
note = "Counting ambiguity between 'second tick' and 'second tick after boot'; range spans both."

[[claim]]
id = "l30.brownedout-flips"
kind = "number"
library = ["wpilib"]
criticality = "C3"
statement = "With every limit off on the tired battery, Power/BrownedOut switches between true and false dozens of times in a few seconds (more than a hundred in most runs) and reads false at the end."
evidence = "CLAUDE.md, 'v3 Lessons 28-32 re-measured on alpha-8', Lesson 29 (Lesson 30 Try It #8: about 110-140 changes in the eight collapsed runs, about 25 in the two that finished)"
measured_on = "alpha-8"
method = "LOOP"
wording = "dozens of times ... more than a hundred in most runs"
unit = "changes"
range = [24, inf]
measured = "110-140 in 8 of 10 runs, about 25 in the other 2"
note = "Band: at least dozens (24 or more) in every run, more than 100 in most (a check can require 100 in at least 6 of 10)."
