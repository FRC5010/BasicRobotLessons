# Numbers Lesson 26 (drive to pose) quotes that a library change could move.
# Format: tools/claims/README.md. Real Robot loop on its own thread, 20 ms, Blue 1, error against the simulated truth.

[[claim]]
id = "l26.sketch-arrival-time"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "The Lesson 11 sketch, (1, 1) to (5, 4), declares success after about three seconds."
evidence = "CLAUDE.md, 'v3 Lessons 24-27 re-measured on alpha-8 with the committed Kraken constants', Lesson 26 (sketch declares success at 3.18-3.20 s with 45.6-46.8 mm left, 3 runs)"
measured_on = "alpha-8"
method = "LOOP"
wording = "about three seconds"
unit = "s"
range = [2.0, 4.0]
measured = "3.18-3.20 s"

[[claim]]
id = "l26.grip-launch-accel"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "A speed request of full speed from a standstill is met at the grip limit, 11.8 m/s^2 (kWheelCoF x 9.81); the same limit is hit when the plan is told the robot is stopped and it brakes."
evidence = "CLAUDE.md, 'v3 Lessons 24-27 re-measured on alpha-8 with the committed Kraken constants', Lesson 26 (acceleration on the first ticks 11.76-11.85 m/s^2; both resets from 0 brake at a peak of 11.77); see l16.grip-slope"
measured_on = "alpha-8"
method = "LOOP"
wording = "11.8 m/s^2 (section 1, table, Try It #2)"
unit = "m/s^2"
range = [11.75, 11.85]
measured = "11.76-11.85 m/s^2; 11.77 exactly"
figure = "26-two-stage-speed.png"
note = "Equals kWheelCoF x 9.81, so it tracks the course's constant and slewRateLimit arithmetic, not a motor model; the same quantity as l16.grip-slope."

