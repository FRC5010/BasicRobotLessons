# Numbers Lesson 4 (simulation) quotes that a library change could move. Format: tools/claims/README.md.
# Method: the Lesson 4 rig (CLAUDE.md, 'Batch 2 found'); data in tools/figures/data/04-velocity-*.csv.

[[claim]]
id = "l04.steady-velocity"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "driveAtSpeed(0.3) on the lesson's DCMotorSim settles at 30.5 rotations per second on 3.6 V, for either inertia."
evidence = "CLAUDE.md, 'Batch 2 found', Lesson 4 rig (steady 30.47 rot/s on 3.598 V)"
measured_on = "alpha-8"
method = "RIG"
wording = "30.5 rotations per second (section 6 and the alt text)"
unit = "rot/s"
range = [30.45, 30.55]
measured = "30.47 rot/s; 30.469 in the figure's data"
figure = "04-velocity-two-inertias.png"
note = "Derived from the Kraken model and the 12 V battery, so it also moves with wpilib.kraken-x60-model and wpilib.sim-battery-rests-at-12v."

