[[claim]]
id = "l18.live-kg-zero-sag"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "Holding at kScoreMid, changing the Elevator/KG tunable to 0 from a dashboard sags the hold to about 1.5 mm within a second (the same as zeroing the constant), and changing it back to 0.17 returns it to the model's 0.19 mm."
evidence = "Probe ElevatorLiveKgProbe (2026-11-26, Lesson 18 state, not kept): the real Elevator through the scheduler at a fixed 20 ms, a RobotBase for the /Tunables backend, a NetworkTables publisher standing in for SimGUI. Two runs, identical: gap 0.1939 mm with the model; after writing 0 it read 1.5576 mm at 1 s and toggled 1.5186/1.5576 mm to 6 s; 0.1939 mm 5 s after writing 0.17 back."
measured_on = "alpha-8"
method = "RIG"
wording = "about 1.5 mm, within a second (section 10's live kG step)"
unit = "mm"
range = [1.4, 1.6]
measured = "1.5186-1.5576 mm"
