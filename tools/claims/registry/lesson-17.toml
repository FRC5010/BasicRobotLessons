# Numbers Lesson 17 (B-Line autos) quotes that a library change could move.
# Format: tools/claims/README.md. Two Corners at 2 m/s, 6 m/s^2, 0.5 m handoff, real Robot loop, Blue 1.

[[claim]]
id = "l17.corner-overshoot"
kind = "number"
library = ["bline", "wpilib"]
criticality = "C2"
statement = "In Two Corners at 2 m/s and a 0.5 m handoff radius, the robot swings 14-16 cm past the first corner (x = 6.0) before it heads up the second leg."
evidence = "CLAUDE.md, 'v3 Lessons 7-22 re-measured on alpha-8', Lesson 17 (six runs, 14-16 cm; alpha-7 13.9-15.3)"
measured_on = "alpha-8"
method = "LOOP"
wording = "14-16 cm; 14-16 cm again in Try It #2"
unit = "cm"
range = [13.5, 16.5]
measured = "14-16 cm over six runs; 15.5-16.2 cm in the three figure runs (tools/figures/data/17-two-corners-run1..3.csv)"

[[claim]]
id = "l17.fig-corner-overshoot"
kind = "number"
library = ["bline", "wpilib"]
criticality = "C2"
statement = "In Figure 17.4's run the robot goes about 16 cm past x = 6, which is also where the cross-track error bottoms out (-0.16 m); three runs gave 15-16 cm."
evidence = "tools/figures/data/17-two-corners-run1..3.csv, read 2026-11-19; CLAUDE.md, Lesson 17 re-measure"
measured_on = "alpha-8"
method = "LOOP"
wording = "about 16 centimeters; 15-16 cm for three runs; bottoms out at -0.16 m, 16 cm past the line"
unit = "cm"
range = [15.5, 16.5]
measured = "max x minus 6: 15.5, 16.2, 16.1 cm; crossTrackError minimum -0.158, -0.164, -0.163 m"
test = "tools/figures/probes/Fig17TwoCorners.java"
figure = "17-two-corners-track.png"
note = "The 'about 16' in the alt text allows 15-17 and 'three runs gave 15-16' allows 14.5-16.5; the bare -0.16 m and '16 cm' allow 15.5-16.5, the tightest."

