measured_on = "alpha-8"
method = "LOOP"
wording = "about a third of a degree; the third of a degree of wheel lag"
unit = "deg"
range = [0.27, 0.40]
measured = "0.29 deg (14.61 measured minus 14.32 predicted)"

[[claim]]
id = "l27.orbit-ff-error"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "With feedforward added, a typical orbit run at 2 and 3 m/s reads 0.1 degrees of Aim/ErrorDegrees once settled."
evidence = "CLAUDE.md, 'v3 Lessons 24-27 re-measured on alpha-8', Lesson 27, P + feedforward row (user decision 2026-10-30: the table gives the typical run); data/27-orbit-aim-error-FF-*.csv"
measured_on = "alpha-8"
method = "LOOP"
wording = "0.1 degrees at 2 m/s and at 3 m/s (the table); sits on zero (Figure 27.2's alt text)"
unit = "deg"
range = [0.05, 0.15]
measured = "typically 0.04-0.13 deg; 4 of 12 runs spiked to 0.19-1.19 deg at some tick when a camera correction landed; 0.01-0.05 deg at the end of Figure 27.2's runs"
note = "A typical-run claim: check the median of the settled error, not the worst tick. The spikes are covered by l27.camera-bump."

[[claim]]
id = "l27.ff-factor"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C3"
statement = "At 3 m/s, feedforward cuts the settled aim error by more than a hundred times (14.6 deg to 0.1 deg)."
evidence = "CLAUDE.md, 'v3 Lessons 24-27 re-measured on alpha-8', Lesson 27 (user decision: the typical run, 'over a hundred times')"
measured_on = "alpha-8"
method = "LOOP"
wording = "over a hundred times better at 3 m/s; more than a hundred times (recap)"
unit = "ratio"
range = [100.0, inf]
measured = "typical run: 14.6 / 0.04-0.13 = 112-365 times"
note = "Holds for the typical run only: a run with a camera-correction spike (0.8 deg worst, 12 times over) would not meet it, so a check should use the settled median."

