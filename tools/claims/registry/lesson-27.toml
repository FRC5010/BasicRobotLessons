# Numbers Lesson 27 (aim at tag) quotes that a library change could move.
# Format: tools/claims/README.md. Measured with the real Drivetrain through the scheduler (LOOP),
# orbit 3 m out of tag 20, 6 runs per configuration (CLAUDE.md, 'v3 Lessons 24-27 re-measured on
# alpha-8', Lesson 27). Figure 27.2 data: tools/figures/data/27-orbit-aim-error-*.csv.
# The 14.32 and 9.55 degree arithmetic (1.0 / kAimP, 0.667 / kAimP) comes from course constants
# alone and is not a claim.

[[claim]]
id = "l27.orbit-p-3"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "Orbiting tag 20 at 3 m out and 3 m/s with only the P term aiming, the worst Aim/ErrorDegrees once settled (read from the pose estimate) is 14.6 degrees."
evidence = "CLAUDE.md, 'v3 Lessons 24-27 re-measured on alpha-8', Lesson 27 (orbit); data/27-orbit-aim-error-P-3.csv"
measured_on = "alpha-8"
method = "LOOP"
wording = "14.6 degrees (section 4, the table, Figure 27.2's alt text and caption walk-through)"
unit = "deg"
range = [14.55, 14.65]
measured = "14.61-14.62 deg over 6 runs (alpha-7 14.61, once 14.83); 14.62 deg in Figure 27.2's data"
test = "tools/figures/probes/Fig27Orbit.java"
figure = "27-orbit-aim-error.png"
note = "The wording is a bare 14.6, so the range is its rounding interval; the one alpha-7 run at 14.83 would fall outside it."

[[claim]]
id = "l27.orbit-p-2"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "The same orbit at 2 m/s with only the P term aiming settles at 9.7 degrees of error (estimate)."
evidence = "CLAUDE.md, 'v3 Lessons 24-27 re-measured on alpha-8', Lesson 27 (orbit); data/27-orbit-aim-error-P-2.csv"
measured_on = "alpha-8"
method = "LOOP"
wording = "9.7 degrees (section 4, the table, Figure 27.2's bottom panel)"
unit = "deg"
range = [9.65, 9.75]
measured = "9.66-9.85 deg over 6 runs (alpha-7 9.83); 9.69 deg in Figure 27.2's data"
test = "tools/figures/probes/Fig27Orbit.java"
figure = "27-orbit-aim-error.png"
note = "Bare 9.7 gives [9.65, 9.75]; the 9.85 run is outside it."

