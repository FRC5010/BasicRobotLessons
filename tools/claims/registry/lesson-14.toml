# Numbers Lesson 14 (the pose estimator) quotes that a library change could move.
# Format: tools/claims/README.md. Measured in the real Robot loop (LOOP), robot parked at the
# origin, Start pressed once a second; data in tools/figures/data/14-sighting-nudges-*.csv.

[[claim]]
id = "l14.default-nudge-fraction"
kind = "number"
library = ["wpilib"]
criticality = "C2"
statement = "At default trust each fake sighting closes about a tenth of the distance still left to the sighting."
evidence = "CLAUDE.md, 'Batch 2 found', Lesson 14 (each press closes exactly a tenth of the gap, along the straight line); data/14-sighting-nudges-default.csv"
measured_on = "alpha-8"
method = "LOOP"
wording = "about a tenth of the distance that's left"
unit = "fraction"
range = [0.08, 0.12]
measured = "0.100 on every press (5.385, 4.847, 4.362, 3.926, 3.533, 3.180 m)"
test = "tools/figures/probes/Fig14SightingNudges.java"
figure = "14-sighting-nudges.png"
note = "README's rule for 'about' gives [0, 0.2] for one digit, which is meaningless; the range is the judgement of what 'about a tenth' still describes."

