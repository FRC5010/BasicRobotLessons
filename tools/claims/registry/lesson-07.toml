# Numbers Lesson 7 quotes that a library change could move. Format: tools/claims/README.md.

[[claim]]
id = "l07.kp-0005-within-1deg"
kind = "number"
library = ["phoenix6", "wpilib"]
criticality = "C2"
statement = "With the geared steering module and kP = 0.0005, a 90 degree turn is within 1 degree at about 6 simulated seconds."
evidence = "CLAUDE.md, 'v3 Lessons 7-22 re-measured on alpha-8', Lesson 7 (one SwerveModule, 90 degrees at 20 ms, RIG); data/07-steer-geared-kp-*.csv"
measured_on = "alpha-8"
method = "RIG"
wording = "about 6 simulated seconds (prose); 6.3 seconds (Figure 7.3)"
unit = "s"
range = [6.25, 6.35]
measured = "6.3 s (alpha-7 build: 6.4 s)"
figure = "07-steering-geared-two-gains.png"
note = "The tightest wording is the figure text 6.3 seconds; the prose says about 6."

