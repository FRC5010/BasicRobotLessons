# Numbers Lesson 25 (path events) quotes that a library change could move.
# Format: tools/claims/README.md. Real Robot loop, Blue 1, fresh launch, enabled about 2.2 s after launch unless noted.

[[claim]]
id = "l25.red-strip-time"
kind = "number"
library = ["bline", "commandsv3", "phoenix6", "wpilib"]
criticality = "C2"
statement = "On a fresh launch, enabling a couple of seconds after launch, the strip blinks red for about 3.1 s while the carriage drives down to its switch."
evidence = "CLAUDE.md, 'v3 Lessons 24-27 re-measured on alpha-8 with the committed Kraken constants', Lesson 25 (fresh launch, from the first enabled tick: IDLE 3.06 s, alpha-7 3.10 s, identical for all three autos)"
measured_on = "alpha-8"
method = "LOOP"
wording = "about 3.1 s"
unit = "s"
range = [3.0, 3.2]
measured = "3.06 s (153 ticks) alpha-8; 3.10 s alpha-7"
note = "Red time is (0.34 - 0.0196 d) / 0.0972 s for d seconds between launch and enable: d = 1 gives 3.3 s, d = 2.2 gives 3.06, d = 5 gives 2.5, ten seconds about 1.5. The lesson says 'less if you wait longer'."

