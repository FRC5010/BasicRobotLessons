[[claim]]
id = "l15.replay-io-shift"
kind = "number"
library = ["advantagekit"]
criticality = "C2"
statement = "Adding 0.5 m in X to each observation's pose inside VisionIOLimelight.updateInputs and replaying the recording leaves the replayed pose where it was (a replay never builds VisionIOLimelight)."
evidence = "CLAUDE.md, 'v3 Lessons 14-17 record with AdvantageKit', Lesson 15 (Try It #5, measured on one recording: 0.0000 m)"
measured_on = "alpha-7 (AdvantageKit's alpha-7 jar)"
method = "REPLAY"
wording = "the replayed pose doesn't move at all"
unit = "m"
range = [0.0, 0.0005]
measured = "0.0000 m"

