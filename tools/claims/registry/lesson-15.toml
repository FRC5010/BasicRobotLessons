# Numbers Lesson 15 (Limelight) quotes that a library change could move.
# Format: tools/claims/README.md.

[[claim]]
id = "l15.two-tag-trust"
kind = "number"
library = ["limelightlib", "wpilib"]
criticality = "C2"
statement = "Standing 2 m from a hub, with two tags at about 2.2 m each, the simulated camera's frames carry an x trust of 0.47 m."
evidence = "No record found in CLAUDE.md or tools/figures/data; stated by the lesson (the formula 0.3 x 2.2 / sqrt(2) gives 0.466)"
measured_on = "unverified"
method = "LOOP"
wording = "about 0.47 m ('exactly what this course's own simulation reported')"
unit = "m"
range = [0.465, 0.475]
measured = "none recorded; arithmetic from the formula gives 0.466 m"
note = "The lesson says the simulation reported it exactly; only the formula's value is on record. Range follows 'exactly' at two digits."

[[claim]]
id = "l15.start-tags-distance"
kind = "number"
library = ["wpilib", "limelightlib"]
criticality = "C3"
statement = "From the start pose (0, 0, 0 degrees) the front camera already sees a pair of tags 4 to 6 m down the field."
evidence = "No record found in CLAUDE.md or tools/figures/data for the distances; docs/lesson-plan-opmode-restructure.md records only that Lesson 15's robot boots at (0, 0, 0 degrees) with two tags in view"
measured_on = "unverified"
method = "LOOP"
wording = "4 to 6 m"
unit = "m"
range = [3.5, 6.5]
measured = "none recorded"

[[claim]]
id = "l15.parked-drift-range"
kind = "number"
library = ["limelightlib", "wpilib"]
criticality = "C2"
statement = "With the Try It's shaky camera, a parked robot's estimate ends 15 to 50 cm from where it parked after 60 s."
evidence = "CLAUDE.md, 'Batch 2 found', Lesson 15 Try It #3 re-run (ended 17, 39 and 39 cm; the farthest each got was 25, 52 and 50 cm); tools/figures/data/15-parked-drift-1..3.csv (16.5, 38.9, 38.9 cm at 60 s; worst 24.5, 52.3, 50.4)"
measured_on = "alpha-8"
method = "LOOP"
wording = "anywhere from 15 to 50 cm in 60 seconds"
unit = "cm"
range = [14.5, 50.5]
measured = "ended 16.5, 38.9, 38.9 cm; farthest 24.5, 52.3, 50.4 cm"
test = "tools/figures/probes/Fig15ParkedDrift.java"
figure = "15-parked-drift.png"
note = "Random (unseeded Gaussian scatter), so a check needs k of n runs. The end values fit; run 2's farthest (52.3 cm) is outside the wording if 'in 60 seconds' meant the farthest reached."

