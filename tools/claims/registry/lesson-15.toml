measured_on = "alpha-8"
method = "LOOP"
wording = "17, 39 and 39 cm"
unit = "cm"
range = [16.5, 39.5]
measured = "16.5, 38.9, 38.9 cm"
test = "tools/figures/probes/Fig15ParkedDrift.java"
figure = "15-parked-drift.png"
note = "Three random runs; the range is the hull of the three quoted values (each +-0.5 cm). A re-run will differ, so this is a record of the figure, not a bound."

