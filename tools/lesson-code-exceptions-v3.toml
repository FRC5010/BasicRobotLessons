# "Type this" Java blocks that tools/check-lesson-code-v3.py should not expect to find in the code
# after their lesson. `block` is text that appears in that one block (and no other checked block of
# the lesson). The checker fails on an exception that matches no block, more than one block, or a
# block that now checks out, so remove an entry as soon as it stops being needed.
#
# Kinds of reason:
#   staged      - a later step of the same lesson replaces this code; the reference holds the
#                 lesson's final version.
#   temporary   - the lesson has the student make this change for an experiment and undo it.
#   conditional - the lesson asks for it only in some cases.
#   try-it      - the reference applies a Try It that changes this code (by design, so the
#                 update script keeps robot-specific values in Constants.java).

